# Local development dependencies. The API itself runs on the host with hot reload:
#   docker compose -f deploy/compose/compose.dev.yml up -d
#   cd backend && uv run fastapi dev src/ballup/main.py
name: ballup-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgis/postgis:18-3.6
    logging: *default-logging
    environment:
      POSTGRES_DB: ballup
      POSTGRES_USER: ballup
      POSTGRES_PASSWORD: ballup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballup -d ballup"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.10.2-alpine
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
