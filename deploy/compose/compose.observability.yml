# Self-hosted observability: metrics (Prometheus), traces (Tempo), dashboards (Grafana), uptime (Uptime Kuma).
# Logs stay structured JSON on stdout and are kept by Docker's json-file driver with rotation (see ADR 0016).
# Combine with compose.yml (prod) or compose.dev.yml (local).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

# Keine Rechte-Ausweitung im Container (setuid usw.). Speicherlimits pro Dienst stehen beim Dienst.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    <<: *hardening
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Host-Metriken (Platte, RAM, CPU) für die Grafana-Alarme. Kein Port nach außen, nur Prometheus fragt ab.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    <<: *hardening
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  tempo:
    image: grafana/tempo:3.1.1
    <<: *hardening
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:13.3.0
    <<: *hardening
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    # Nicht öffentlich: nur auf dem Loopback des Servers, öffnen mit npm run tunnel:grafana.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      # ntfy-Thema für Alarme aufs Handy (provisioning/alerting/alerts.yml), legt harden.sh an.
      NTFY_URL: ${NTFY_URL:?set NTFY_URL in .env (sudo bash scripts/server/harden.sh)}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    <<: *hardening
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    # Admin UI only on the server's loopback (reach it via SSH tunnel); the public status page goes through Caddy.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
  uptime_kuma_data:
