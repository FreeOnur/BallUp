version: 2

# Einmal im Monat (am 1.), pro Bereich ein gesammelter PR.
# Sicherheitsupdates kommen weiterhin sofort als eigene PRs.

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
      timezone: Europe/Vienna
    commit-message:
      prefix: "build(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: monthly
      timezone: Europe/Vienna
    commit-message:
      prefix: "build(deps)"
    groups:
      mobile:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Vienna
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      timezone: Europe/Vienna
    commit-message:
      prefix: "build(deps)"
    groups:
      backend-image:
        patterns: ["*"]
    ignore:
      # Neue Python-Version (z. B. 3.14 -> 3.15) machen wir bewusst von Hand,
      # wenn alle Bibliotheken sie unterstützen. Patches kommen weiter automatisch.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: monthly
      timezone: Europe/Vienna
    commit-message:
      prefix: "build(deps)"
    groups:
      server-images:
        patterns: ["*"]
